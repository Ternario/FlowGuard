[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = ["Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"
multiline-quotes = "double"
avoid-escape = true

[[tool.mypy.overrides]]
module = "notifypy.*"
ignore_missing_imports = true