services:
  server:
    build: ./server
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app
    env_file:
      - server/.env.database
      - server/.env.server

  mysql:
    image: mysql
    restart: always
    env_file:
      - server/.env.database
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 5
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: